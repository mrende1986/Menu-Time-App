<html>
	<head>
		<title>MatthewRende.com</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="static/assets_new/css/main.css" />
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<div id="main">
						<div class="inner">

							<!-- Header -->
								<header id="header">
									<a href="{{url_for('mr.index')}}" class="logo"><strong>Welcome to MatthewRende.com</strong></a>
									<ul class="icons">
										<li><a href="https://www.linkedin.com/in/matthew-rende/" target="_blank" class="icon brands fa-linkedin"><span class="label">LinkedIn</span></a></li>
										<li><a href="mailto:mrende@gmail.com" target="_blank" class="icon solid fa-envelope"><span class="label">Mail</span></a></li>
										<li><a href="https://github.com/mrende1986" target="_blank" class="icon brands fa-github"><span class="label">GitHub</span></a></li>	
										<li><a href="https://www.instagram.com/mrende/" target="_blank" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>									
									</ul>
								</header>


							<!-- Section -->
								<section>
									<header class="major">
										<h2>Available Meals</h2>
									</header>
									<div class="features">
                    {% for item in meal_stack: %}
										<article>
											<a href="/meal/{{item.id}}"><img src="{{item.image_url}}" alt="Meal Image" width="100" height="100"></a>
											<div class="content">
												<h3>{{item.name}}</h3>
												<p>{{item.description}}</p>
											</div>
										</article>
                    {%endfor%}
									</div>
								</section>


						</div>
					</div>

				<!-- Sidebar -->
				{% include 'menu_bar.html' %}


		<!-- Scripts -->
			<script src="static/assets_new/js/jquery.min.js"></script>
			<script src="static/assets_new/js/browser.min.js"></script>
			<script src="static/assets_new/js/breakpoints.min.js"></script>
			<script src="static/assets_new/js/util.js"></script>
			<script src="static/assets_new/js/main.js"></script>

	</body>
</html>
